name: Project structure validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal project descriptor
        run: python3 -m json.tool ProjectVICE.uproject > /dev/null
      - name: Verify core source files
        run: |
          test -f Source/ProjectVICE/ProjectVICE.Build.cs
          test -f Source/ProjectVICE.Target.cs
          test -f Source/ProjectVICEEditor.Target.cs
          test -f Source/ProjectVICE/ProjectVICE.cpp
          test -f Source/ProjectVICE/VICECharacter.h
          test -f Source/ProjectVICE/VICECharacter.cpp
          test -f Source/ProjectVICE/VICEGameMode.h
          test -f Source/ProjectVICE/VICEGameMode.cpp
          test -f Source/ProjectVICE/VICECityGenerator.h
          test -f Source/ProjectVICE/VICECityGenerator.cpp
          test -f Source/ProjectVICE/VICECityChunk.h
          test -f Source/ProjectVICE/VICECityChunk.cpp
          test -f Source/ProjectVICE/VICEPedestrian.h
          test -f Source/ProjectVICE/VICEPedestrian.cpp
          test -f Source/ProjectVICE/VICETouchHUD.h
          test -f Source/ProjectVICE/VICETouchHUD.cpp
          test -f Source/ProjectVICE/VICEVehiclePawn.h
          test -f Source/ProjectVICE/VICEVehiclePawn.cpp
          test -f Source/ProjectVICE/VICEDayNightController.h
          test -f Source/ProjectVICE/VICEDayNightController.cpp
      - name: Validate editor bootstrap script
        run: python3 -m py_compile Content/Python/create_vice_blockout_map.py
      - name: Verify project documentation
        run: |
          test -f Docs/ROADMAP.md
          test -f Docs/TECHNICAL_DESIGN.md
          test -f Docs/DEVICE_BUDGETS.md
          test -f Docs/BUILD_STATUS.md
          test -f Docs/MAP_SETUP.md
          test -f Docs/VEHICLE_PROTOTYPE.md
          test -f Docs/ENVIRONMENT_PROTOTYPE.md
          test -f Docs/PEDESTRIAN_PROTOTYPE.md
