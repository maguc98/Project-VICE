name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: figure-studio-ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch CC0 female reference mesh
        run: |
          set -euo pipefail
          mkdir -p Resources
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://files.innerscene.com/library/female-base-mesh-3d-person-rigged-a-pose-dba97ed5/c5dce4aeeb1e549cec36/female-base-mesh-base_female.glb" \
            -o Resources/FemaleBase.glb
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path
          data = Path("Resources/FemaleBase.glb").read_bytes()
          if data[:4] != b"glTF":
              raise SystemExit("FemaleBase.glb is not a valid GLB file")
          json_size = struct.unpack_from("<I", data, 12)[0]
          model = json.loads(data[20:20 + json_size].decode("utf-8").rstrip("\\x00 "))
          nodes = model.get("nodes", [])
          print("CC0 FEMALE BASE MESH: nodes =", len(nodes), "skins =", len(model.get("skins", [])))
          for skin in model.get("skins", []):
              print("SKIN JOINTS:")
              for index in skin.get("joints", []):
                  if isinstance(index, int) and index < len(nodes):
                      print(f"  {index}: {nodes[index].get('name', '<unnamed>')}")
          PY

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FigureStudio.xcodeproj \
            -scheme FigureStudio \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for physical iOS devices (unsigned)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          xcodebuild \
            -project FigureStudio.xcodeproj \
            -scheme FigureStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FigureStudio.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/FigureStudio.xcarchive/Products/Applications/FigureStudio.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/FigureStudio.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/FigureStudio-unsigned.ipa"
          test -s "$RUNNER_TEMP/FigureStudio-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/FigureStudio-unsigned.ipa" | head -30

      - name: Upload unsigned IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: figure-studio-unsigned-ipa
          path: ${{ runner.temp }}/FigureStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
