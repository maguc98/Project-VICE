name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project FigureStudio.xcodeproj \
            -scheme FigureStudio \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive for physical iOS devices (unsigned)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          xcodebuild \
            -project FigureStudio.xcodeproj \
            -scheme FigureStudio \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FigureStudio.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/FigureStudio.xcarchive/Products/Applications/FigureStudio.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/FigureStudio.app"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/FigureStudio-unsigned.ipa"
          test -s "$RUNNER_TEMP/FigureStudio-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/FigureStudio-unsigned.ipa" | head -30

      - name: Upload unsigned IPA
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: figure-studio-unsigned-ipa
          path: ${{ runner.temp }}/FigureStudio-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
