name: iOS Visitor Preview

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: Build unsigned IPA for later signing, or sign on the runner
        required: true
        default: unsigned
        type: choice
        options:
          - unsigned
          - signed
      notes:
        description: Build notes for this visitor preview
        required: false
        type: string

permissions:
  contents: read

jobs:
  package-ios:
    # Requires a macOS self-hosted runner with UE 5.4 and Xcode installed.
    # Signing assets stay in that runner's local keychain/profile directory.
    runs-on: [self-hosted, macOS, ue5.4, ios]
    timeout-minutes: 180
    env:
      UE_ROOT: ${{ vars.UE_ROOT }}
      IOS_SIGNING_MODE: ${{ inputs.build_mode }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_SIGNING_CERTIFICATE: ${{ vars.IOS_SIGNING_CERTIFICATE }}
      IOS_MOBILE_PROVISION: ${{ vars.IOS_MOBILE_PROVISION }}
      IOS_BUNDLE_IDENTIFIER: com.maguc98.projectvice
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Unreal and Apple toolchains
        run: |
          test -n "$UE_ROOT"
          test -x "$UE_ROOT/Engine/Binaries/Mac/UnrealEditor-Cmd"
          test -x "$UE_ROOT/Engine/Build/BatchFiles/RunUAT.sh"
          xcodebuild -version
          if [[ "${IOS_SIGNING_MODE}" == "signed" ]]; then
            security find-identity -v -p codesigning
          fi

      - name: Validate packaging scripts
        run: |
          bash -n Scripts/package_ios_preview.sh
          python3 -m json.tool ProjectVICE.uproject > /dev/null
          python3 -m py_compile Content/Python/create_vice_blockout_map.py

      - name: Build visitor preview IPA
        run: bash Scripts/package_ios_preview.sh

      - name: Upload visitor preview IPA
        uses: actions/upload-artifact@v4
        with:
          name: ProjectVICE-VisitorPreview-iOS
          path: |
            Artifacts/IOS/ProjectVICE-VisitorPreview.ipa
            Artifacts/IOS/ProjectVICE-VisitorPreview.ipa.sha256
          if-no-files-found: error
          retention-days: 14
