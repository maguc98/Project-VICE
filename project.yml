name: FigureStudio
options:
  bundleIdPrefix: com.maguc98
  deploymentTarget:
    iOS: "17.0"
packages:
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2.git
    from: 0.5.14
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.figurestudio
    INFOPLIST_KEY_CFBundleDisplayName: "人体工坊"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FigureStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources/FigureStudio
      - path: Resources/FemaleBase.glb
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    settings:
      base:
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        GENERATE_INFOPLIST_FILE: YES
