name: FigureStudio
options:
  bundleIdPrefix: com.maguc98
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.maguc98.figurestudio
    INFOPLIST_KEY_CFBundleDisplayName: "人体工坊"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FigureStudio:
    type: application
    platform: iOS
    sources:
      - Sources/FigureStudio
    settings:
      base:
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        GENERATE_INFOPLIST_FILE: YES
